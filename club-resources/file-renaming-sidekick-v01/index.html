<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File-Renaming Sidekick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="12" r="4"/><path d="M11.5 12H21M17 12v3.5M20 12v2.5"/></svg>
      <span>AI Master Key</span>
    </div>
    <div class="step-tag" id="stepTag">Welcome</div>
  </header>
  <div class="bar" id="bar" aria-hidden="true"></div>
  <div class="safety" id="safety" hidden><i></i><span>Setup only. Nothing in your files changes here.</span></div>

  <main id="app" class="stage"></main>

  <footer class="foot">
    <span>Everything you type stays on this page. Nothing is sent anywhere.</span>
    <button type="button" class="linkbtn" id="resetBtn" data-act="reset">Start over</button>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/data.js"></script>
<script src="js/naming.js"></script>
<script src="js/package.js"></script>
<script src="js/app.js"></script>
</body>
</html>
